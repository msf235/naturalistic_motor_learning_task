params:
  name: ball_throw
  xml_file: './model_files/humanoid_and_baseball.xml'
  # Tf: 0.6
  Tf: 1.6
  t_after: 1.0
  # max_its: 500
  max_its: 3000
  # optimizer: 'adam'
  # lr: .001
  # lr2: .0005
  # it_lr2: 350
  optimizer: 'rmsprop'
  lr: 0.1
  lr2: 0.1
  # optimizer: 'sgd'
  # lr: 2e5
  # lr2: 1
  it_lr2: 350
  grad_update_every: 10
  reset_noise_scale: 0
  t_incr: .1
  incr_every: 100
  grab_phase_it: 400
  grab_phase_t: .6
  grad_window_t: .1
  # joint_penalty_factor: 1e-6
  # balance_cost: 6000
  # joint_cost: 200
  # foot_cost: 6000
  # ctrl_cost: 100
  # root_cost: 10
  joint_penalty_factor: 1e-7
  balance_cost: 0
  root_cost: 1e2
  joint_cost: 5e5
  foot_cost: 0
  ctrl_cost: 1
  # ctrl_reg_weight: 1e-6
  ctrl_reg_weight: 0
  mask_decay_factor: .9
